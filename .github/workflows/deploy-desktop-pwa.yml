name: Terbit Diari Kaunselor Desktop (PWA)

on:
  push:
    branches: [main, master]
    paths:
      - 'desktop-web/**'
      - '.github/workflows/deploy-desktop-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-desktop-pwa
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop-web/package-lock.json

      - name: Install Desktop PWA dependencies
        working-directory: desktop-web
        run: npm install

      - name: Run Cross-Platform E2EE & Export Tests
        working-directory: desktop-web
        run: npm test

      - name: Build Desktop PWA
        working-directory: desktop-web
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: desktop-web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
